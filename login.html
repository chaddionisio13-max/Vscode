<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in to your Northstar account."><title>Log in — Northstar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="site-header"><a class="brand" href="index.html" aria-label="Northstar home"><span class="brand-mark">✳</span> northstar</a><a class="text-link" href="signup.html">Create account <span aria-hidden="true">↗</span></a></header>
  <main class="auth-main">
    <section class="auth-intro"><p class="eyebrow"><span class="eyebrow-line"></span> Welcome back</p><h1>Return to what <em>matters.</em></h1><p>Your plans are right where you left them. Take a breath, then take the next right step.</p></section>
    <section class="auth-form-wrap" aria-labelledby="login-title"><h2 id="login-title">Log in to Northstar</h2><p class="form-subtitle">Good to see you again.</p>
      <form data-demo-form="login" novalidate>
        <div class="form-group"><label class="form-label" for="email">Email address</label><input class="form-input" id="email" name="email" type="email" autocomplete="email" required><p class="field-error" data-error-for="email"></p></div>
        <div class="form-group"><label class="form-label" for="password">Password</label><div class="input-wrap"><input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle aria-controls="password" aria-label="Show password">Show</button></div><p class="field-error" data-error-for="password"></p></div>
        <div class="form-options"><label class="checkbox-label"><input type="checkbox" name="remember"> Remember me</label><a href="#reset" data-forgot-password>Forgot password?</a></div>
        <button class="button form-submit" type="submit">Log in <span aria-hidden="true">↗</span></button><p class="form-message" role="status" aria-live="polite"></p><p class="form-foot">New to Northstar? <a href="signup.html">Create an account</a></p>
      </form>
    </section>
  </main>
  <footer class="auth-footer"><div class="site-footer page-grid"><a class="brand" href="index.html"><span class="brand-mark">✳</span> northstar</a><p>For work with a pulse.</p><span></span></div></footer><script src="script.js"></script>
</body>
</html>
